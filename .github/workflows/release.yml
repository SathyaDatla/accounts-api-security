name: release
on:
  push:
    branches: [main]
permissions:
  contents: read
  id-token: write
jobs:
  release:
    environment: production
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::123456789012:role/accounts-api-release
          aws-region: ap-south-1
      - uses: aws-actions/amazon-ecr-login@v2
      - uses: docker/setup-buildx-action@v3
      - name: Build and push immutable commit tag
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: 123456789012.dkr.ecr.ap-south-1.amazonaws.com/accounts-api:${{ github.sha }}
      - uses: sigstore/cosign-installer@v3
      - uses: anchore/sbom-action@v0
        with:
          image: 123456789012.dkr.ecr.ap-south-1.amazonaws.com/accounts-api@${{ steps.build.outputs.digest }}
          format: spdx-json
          output-file: accounts-api.spdx.json
      - name: Publish SBOM as signed OCI attestation
        env:
          IMAGE: 123456789012.dkr.ecr.ap-south-1.amazonaws.com/accounts-api@${{ steps.build.outputs.digest }}
        run: cosign attest --yes --type spdxjson --predicate accounts-api.spdx.json "$IMAGE"
      - name: Scan built image
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: 123456789012.dkr.ecr.ap-south-1.amazonaws.com/accounts-api@${{ steps.build.outputs.digest }}
          severity: CRITICAL,HIGH
          exit-code: '1'
      - name: Sign image keylessly
        env:
          IMAGE: 123456789012.dkr.ecr.ap-south-1.amazonaws.com/accounts-api@${{ steps.build.outputs.digest }}
        run: cosign sign --yes "$IMAGE"
      - name: Verify signature
        env:
          IMAGE: 123456789012.dkr.ecr.ap-south-1.amazonaws.com/accounts-api@${{ steps.build.outputs.digest }}
        run: cosign verify "$IMAGE" --certificate-identity-regexp '^https://github.com/bank/accounts-api/.github/workflows/release.yml@refs/heads/main$' --certificate-oidc-issuer https://token.actions.githubusercontent.com
      - name: Verify SBOM attestation
        env:
          IMAGE: 123456789012.dkr.ecr.ap-south-1.amazonaws.com/accounts-api@${{ steps.build.outputs.digest }}
        run: cosign verify-attestation --type spdxjson "$IMAGE" --certificate-identity-regexp '^https://github.com/bank/accounts-api/.github/workflows/release.yml@refs/heads/main$' --certificate-oidc-issuer https://token.actions.githubusercontent.com
