apiVersion: apps/v1
kind: Deployment
metadata:
  name: accounts-api
  namespace: accounts
  labels:
    app.kubernetes.io/name: accounts-api
    threat: T1
spec:
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: accounts-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: accounts-api
    spec:
      serviceAccountName: accounts-api
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: 123456789012.dkr.ecr.ap-south-1.amazonaws.com/accounts-api@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          ports:
            - name: http
              containerPort: 8080
          securityContext:
            privileged: false
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          volumeMounts:
            - name: runtime-secret
              mountPath: /run/secrets/accounts-api
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: runtime-secret
          secret:
            secretName: accounts-api-runtime
            defaultMode: 0400
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
