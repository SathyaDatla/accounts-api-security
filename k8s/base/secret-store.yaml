apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: accounts-api-aws
  namespace: accounts
spec:
  provider:
    aws:
      service: SecretsManager
      region: ap-south-1
      auth:
        jwt:
          serviceAccountRef:
            name: accounts-api-secrets
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: accounts-api-secrets
  namespace: accounts
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::123456789012:role/accounts-api-secrets
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: accounts-api-runtime
  namespace: accounts
spec:
  refreshInterval: 5m
  secretStoreRef:
    name: accounts-api-aws
    kind: SecretStore
  target:
    name: accounts-api-runtime
    creationPolicy: Owner
    template:
      type: Opaque
  data:
    - secretKey: database-url
      remoteRef:
        key: prod/accounts-api/database
        property: url
    - secretKey: kyc-api-key
      remoteRef:
        key: prod/accounts-api/kyc
        property: api_key
